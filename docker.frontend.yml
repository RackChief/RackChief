services:
  frontend:
    build:
      context: ./Frontend/nuxt
      dockerfile: ../../docker/frontend.dev.Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
      NUXT_PROXY_TARGET: http://backend:${BACKEND_PORT:-3000}
      NUXT_BACKEND_URL: http://backend:${BACKEND_PORT:-3000}
    command: ["npm", "run", "dev", "--", "--port", "${FRONTEND_PORT:-5173}"]
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - ./Frontend/nuxt:/app
      - nuxt_node_modules:/app/node_modules

volumes:
  nuxt_node_modules:
