services:
  backend:
    build:
      context: ./Backend
      dockerfile: ../docker/backend.dev.Dockerfile
    environment:
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in .env}
      DEVICE_IMAGE_DIR: /data/device-images
    expose:
      - "${BACKEND_PORT:-3000}"
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules
      - ./.data/device-images:/data/device-images
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s

  frontend:
    build:
      context: ./Frontend/nuxt
      dockerfile: ../../docker/frontend.dev.Dockerfile
    environment:
      NUXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env}
      NUXT_PROXY_TARGET: http://backend:${BACKEND_PORT:-3000}
      NUXT_BACKEND_URL: http://backend:${BACKEND_PORT:-3000}
    command: ["npm", "run", "dev", "--", "--port", "5175"]
    ports:
      - "5175:5175"
    volumes:
      - ./Frontend/nuxt:/app
      - nuxt_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_node_modules:
  nuxt_node_modules:
