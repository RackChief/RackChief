services:
  backend:
    build:
      context: ./Backend
      dockerfile: ../docker/backend.dev.Dockerfile
    environment:
      PORT: ${BACKEND_PORT:-3000}
      PG_USER: ${PG_USER:?Set PG_USER in .env}
      PG_PASS: ${PG_PASS:?Set PG_PASS in .env}
      PG_HOST: ${PG_HOST:?Set PG_HOST in .env}
      PG_DB_NAME: ${PG_DB_NAME:?Set PG_DB_NAME in .env}
      PG_PORT: ${PG_PORT:-5432}
      PG_SSLMODE: ${PG_SSLMODE:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DEVICE_IMAGE_DIR: /data/device-images
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules
      - ./.data/device-images:/data/device-images
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s

volumes:
  backend_node_modules:
